<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Day Simulation</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header>
      <h1>🏅 Annual Sports Day 🏅</h1>
      <p>Click the button below to simulate the sequence of events.</p>
    </header>

    <div class="controls">
      <button id="start-btn">Start Event</button>
    </div>

    <div class="terminal-wrapper">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">Live Event Ticker</span>
      </div>
      <div id="event-logs" class="terminal-body">
        <div class="log-entry system">Waiting for event to start...</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
