<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Picture of the Day</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="nav-content">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/></svg>
        <h1>NASA APOD</h1>
      </div>
      <form id="search-form" class="search-form">
        <label for="search-input">Select Date:</label>
        <input type="date" id="search-input" required>
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="main-container">
    <section class="content-wrapper">
      <div id="current-image-container" class="image-card">
        <div class="loader">Loading stellar content...</div>
        <!-- APOD content gets injected here -->
      </div>
    </section>

    <aside class="history-sidebar">
      <div class="history-card">
        <h3>Search History</h3>
        <p class="history-desc">Click a date to revisit your cosmic journey.</p>
        <ul id="search-history">
          <!-- History items will be injected here -->
        </ul>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
