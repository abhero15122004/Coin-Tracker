<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Tracker</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search By Name or Symbol">
      <div class="sort-buttons">
        <button id="sort-mkt-cap">Sort By Mkt Cap</button>
        <button id="sort-percentage">Sort by percentage</button>
      </div>
    </div>

    <div class="table-container">
      <table id="coin-table">
        <tbody id="coin-table-body">
          <!-- Rows will be injected here via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
